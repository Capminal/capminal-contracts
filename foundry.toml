# Root Foundry config — shared defaults. Each project under `projects/*` extends this
# and adds its own `src` / `remappings`.

[rpc_endpoints]
"mainnet/base" = "https://mainnet.base.org"
"sepolia/base" = "https://sepolia.base.org"
"mainnet/op" = "https://mainnet.optimism.io"
"sepolia/op" = "https://sepolia.optimism.io"

[profile.default]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"

src = "src"
test = "test"
out = "out"
libs = ["lib"]

gas_reports = ["*"]
gas_reports_ignore = ["forge-std", "ds-test"]

# Test settings
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 15 }

verbosity = 2

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000, depth = 20 }

[profile.lite]
optimizer = false
fuzz = { runs = 100 }
invariant = { runs = 50, depth = 5 }

[profile.debug]
optimizer = false
optimizer_runs = 0
verbosity = 3
debug = true
